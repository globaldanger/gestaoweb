<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Gestão</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
  <h1 class="text-2xl font-bold mb-4">Cadastro de Cliente e Mercadoria</h1>
  <div class="grid gap-4 grid-cols-1 md:grid-cols-2">
    <input id="nome" placeholder="Nome do Cliente" class="p-2 border rounded" />
    <input id="email" placeholder="Email do Cliente" class="p-2 border rounded" />
    <input id="telefone" placeholder="Telefone" class="p-2 border rounded" />
    <input id="endereco" placeholder="Endereço" class="p-2 border rounded" />
    <input id="mercadoria" placeholder="Nome da Mercadoria" class="p-2 border rounded" />
    <input id="valor" placeholder="Valor da Mercadoria" class="p-2 border rounded" />
  </div>
  <button id="salvarBtn" class="mt-4 bg-green-500 text-white p-2 rounded">Salvar</button>

  <h2 class="text-xl font-bold mt-6">Clientes Cadastrados</h2>
  <div id="listaClientes" class="mt-4 space-y-2"></div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
