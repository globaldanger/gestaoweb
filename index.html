<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Sistema de Gestão</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-4 text-center">Sistema de Gestão</h2>
    <input id="email" type="email" placeholder="Email" class="w-full mb-2 p-2 border rounded" />
    <input id="senha" type="password" placeholder="Senha" class="w-full mb-4 p-2 border rounded" />
    <button id="loginBtn" class="w-full bg-blue-500 text-white p-2 rounded mb-2">Entrar</button>
    <button id="cadastroBtn" class="w-full bg-green-500 text-white p-2 rounded">Criar Conta</button>
    <p id="mensagem" class="text-center text-red-500 mt-2"></p>
  </div>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
